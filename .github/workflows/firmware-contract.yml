name: Firmware contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run firmware and merged-main regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile changed Python entry points
        run: python -m py_compile firmware_fetch.py calibration_quality.py run_Calibratron.py helpers.py
