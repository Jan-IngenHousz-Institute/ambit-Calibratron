name: Firmware contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run the bench, firmware and GUI regression tests
        run: python -m pytest tests -q
      - name: Compile the Python entry points
        run: >-
          python -m py_compile firmware_fetch.py helpers.py spec_cal.py quality.py
          run_calibratron.py calibratron_gui.py openjii_auth.py runtime_paths.py
          packaging/launcher.py
